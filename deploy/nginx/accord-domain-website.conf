# Internal HTTP listener. Bind to 127.0.0.1 only via Docker Compose.
# Public TLS must terminate at the existing ELFAR edge reverse proxy.
server {
    listen 80;
    server_name accordniche.pp.ua;
    if ($host != accordniche.pp.ua) { return 444; }
    server_tokens off;
    # Docker API can receive a new IP during rolling rebuild; re-resolve it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend "http://api:8000";
    # The TLS edge always overwrites X-Real-IP. Restrict trust to local
    # Docker/loopback gateway; per-client rate limits must not group all users.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    limit_conn accord_conn 40;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://accounts.google.com; font-src 'self' data:" always;

    location /assets/ { try_files $uri =404; expires 30d; access_log off; }
    # SEO: per-URL <head> tags are inserted by SSI from the API. A slow or
    # failing API never breaks the page: the stub in index.html is used.
    location = /site.webmanifest { default_type application/manifest+json; try_files $uri =404; expires 1d; }
    location ~ "^/(?:favicon\.ico|icon\.svg|icon-[a-z0-9-]+\.png|apple-touch-icon\.png|logo\.png)$" { try_files $uri =404; expires 7d; access_log off; }
    location = /index.html {
        expires -1; ssi on; ssi_silent_errors on;
        # Unknown aromas, articles and addresses answer HTTP 404 with the same
        # «not found» page (no soft 404s). If the API is slow or down, the
        # page is served as before (500 from auth_request -> plain fallback).
        auth_request /__page_exists;
        error_page 403 =404 /__page_missing;
        error_page 500 = /__page_unchecked;
    }
    location = /__page_exists {
        internal;
        proxy_pass $api_backend/api/public/seo/exists;
        include /etc/nginx/proxy-params/accord.conf;
        proxy_set_header X-Accord-Path $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 2s;
    }
    location = /__page_missing { internal; expires -1; ssi on; ssi_silent_errors on; rewrite ^ /index.html break; }
    location = /__page_unchecked { internal; expires -1; ssi on; ssi_silent_errors on; rewrite ^ /index.html break; }
    location = /__seo_head {
        internal;
        proxy_pass $api_backend/api/public/seo/head;
        include /etc/nginx/proxy-params/accord.conf;
        # In an SSI subrequest $request_uri is the visitor's original URI.
        proxy_set_header X-Accord-Path $request_uri;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 403 404 422 429 500 502 503 504 = /__seo_empty;
    }
    location = /__seo_empty { internal; return 204; }
    # Android App Links: product and catalog links open in the ACCORD app. No add_header/expires here:
    # Cache-Control (no-store while empty, public 5 min once filled) and Content-Type come from the API.
    location = /.well-known/assetlinks.json { limit_req zone=accord_public burst=10 nodelay; proxy_pass $api_backend/api/public/android/assetlinks.json; include /etc/nginx/proxy-params/accord.conf; }
    # Sitemap index and its sections, built from the database (see shop/services/seo.py).
    location ~ "^/sitemap(-(?:pages|aromas|blog))?\.xml$" { limit_req zone=accord_public burst=10 nodelay; proxy_pass $api_backend/api/public/seo/sitemap$1.xml; include /etc/nginx/proxy-params/accord.conf; }
    location ~ "^/sitemap[^/]*\.xml$" { return 404; }
    # Google Merchant Center product feed and blog RSS (see shop/services/feeds.py).
    location = /feeds/google-merchant.xml { limit_req zone=accord_public burst=5 nodelay; proxy_pass $api_backend/api/public/seo/merchant.xml; include /etc/nginx/proxy-params/accord.conf; }
    location = /blog/rss.xml { limit_req zone=accord_public burst=10 nodelay; proxy_pass $api_backend/api/public/seo/blog-rss.xml; include /etc/nginx/proxy-params/accord.conf; }
    # IndexNow key file (https://accordniche.pp.ua/<ACCORD_INDEXNOW_KEY>.txt); 404 for any other name.
    location ~ "^/([A-Za-z0-9-]{8,128})\.txt$" { limit_req zone=accord_public burst=5 nodelay; proxy_pass $api_backend/api/public/seo/indexnow/$1.txt; include /etc/nginx/proxy-params/accord.conf; }
    location = /api/public/catalog { limit_req zone=accord_public burst=30 nodelay; proxy_pass $api_backend; include /etc/nginx/proxy-params/accord.conf; }
    location ^~ /api/public/ { limit_req zone=accord_public burst=30 nodelay; proxy_pass $api_backend; include /etc/nginx/proxy-params/accord.conf; }
    location = /api/web/analytics/visit { limit_req zone=accord_visit burst=10 nodelay; client_max_body_size 4k; proxy_pass $api_backend; include /etc/nginx/proxy-params/accord.conf; }
    location ^~ /api/web/ { limit_req zone=accord_customer burst=15 nodelay; proxy_pass $api_backend; include /etc/nginx/proxy-params/accord.conf; }
    # No dashboard API reachable via the public store. Query strings never grant access.
    location ^~ /api/ { return 404; }
    # Shared read-only product images, never invoices/backups/private uploads.
    location ~* ^/media/([A-Za-z0-9_-]+\.(?:jpg|jpeg|png|gif|webp))$ {
        alias /data/media/$1;
        disable_symlinks on;
        expires 30d;
        access_log off;
    }
    location /media/ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
