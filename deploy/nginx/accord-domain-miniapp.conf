# Telegram Mini App only. Customer API requires signed initData in FastAPI.
server {
    listen 80;
    server_name shop.accordniche.pp.ua;
    if ($host != shop.accordniche.pp.ua) { return 444; }
    server_tokens off;
    # Docker API can receive a new IP during rolling rebuild; re-resolve it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend "http://api:8000";
    # The TLS edge always overwrites X-Real-IP. Restrict trust to local
    # Docker/loopback gateway; per-client rate limits must not group all users.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    limit_conn accord_conn 40;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self' data:; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location /assets/ { try_files $uri =404; expires 30d; access_log off; }
    # Webhook is restricted by POST + secret path + independent Telegram header in API.
    location ~ "^/api/telegram/[A-Za-z0-9_-]{16,128}/[0-9]{3,20}$" {
        limit_except POST { deny all; }
        client_max_body_size 256k;
        access_log off; # webhook path contains a secret
        limit_req zone=accord_webhook burst=50 nodelay;
        proxy_pass $api_backend;
        include /etc/nginx/proxy-params/accord.conf;
    }
    location = /api/shop/client-log {
        client_max_body_size 16k;
        limit_req zone=accord_clientlog burst=8 nodelay;
        proxy_pass $api_backend;
        include /etc/nginx/proxy-params/accord.conf;
    }
    location ^~ /api/shop/ {
        limit_req zone=accord_customer burst=30 nodelay;
        proxy_pass $api_backend;
        include /etc/nginx/proxy-params/accord.conf;
        proxy_read_timeout 370s;
        proxy_buffering off;
    }
    location /api/ { return 404; }
    # Shared read-only product images, never invoices/backups/private uploads.
    location ~* ^/media/([A-Za-z0-9_-]+\.(?:jpg|jpeg|png|gif|webp))$ {
        alias /data/media/$1;
        disable_symlinks on;
        expires 30d;
        access_log off;
    }
    location /media/ { return 404; }
    location ~ /\. { return 404; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
