# http context, load BEFORE the three site configs.
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=accord_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=accord_admin:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=accord_customer:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=accord_public:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=accord_webhook:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=accord_conn:10m;
limit_req_zone $binary_remote_addr zone=accord_clientlog:10m rate=20r/m;
