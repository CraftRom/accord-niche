# Admin listener behind the shared HTTPS edge; backend login, scoped session
# cookies, CSRF checks, RBAC and login rate limits protect administration.
server {
    listen 80;
    server_name dashboard.accordniche.pp.ua;
    if ($host != dashboard.accordniche.pp.ua) { return 444; }
    server_tokens off;
    # Docker API can receive a new IP during rolling rebuild; re-resolve it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend "http://api:8000";
    # The TLS edge always overwrites X-Real-IP. Restrict trust to local
    # Docker/loopback gateway; per-client rate limits must not group all users.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    limit_conn accord_conn 25;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    location /assets/ { try_files $uri =404; access_log off; expires 30d; }
    location = /index.html { expires -1; }
    # No legacy bearer-token login on browser-facing domain.
    location = /api/auth/login { return 404; }
    location = /api/auth/browser-login {
        limit_req zone=accord_login burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass $api_backend;
        include /etc/nginx/proxy-params/accord.conf;
    }
    location = /api/realtime/orders {
        limit_req zone=accord_admin burst=12 nodelay;
        proxy_pass $api_backend;
        include /etc/nginx/proxy-params/accord.conf;
        proxy_buffering off;
        proxy_read_timeout 370s;
    }
    location ^~ /api/ {
        limit_req zone=accord_admin burst=35 nodelay;
        proxy_pass $api_backend;
        include /etc/nginx/proxy-params/accord.conf;
        proxy_read_timeout 120s;
    }
    # Images only; no access to local data, dumps or arbitrary files.
    # Shared read-only product images, never invoices/backups/private uploads.
    location ~* ^/media/([A-Za-z0-9_-]+\.(?:jpg|jpeg|png|gif|webp))$ {
        alias /data/media/$1;
        disable_symlinks on;
        expires 30d;
        access_log off;
    }
    location /media/ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
