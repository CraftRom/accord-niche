# ACCORD NICHE: 3-domain TLS behind existing edge proxy, SAFE to run next to ELFAR.
# From the project root:
#   bash deploy/domains.sh up -d --build
# Prefer bash deploy/domains.sh; retain the configured volume namespace.
# Every network and volume is namespaced by -p; no host ports 80/443, 5432, 6379, 8000.

name: ${COMPOSE_PROJECT_NAME:-accord-niche-test}

x-backend-build: &backend-build
  context: ../backend
  args:
    APP_UID: "1000"
    APP_GID: "1000"

x-backend-env: &backend-env
  env_file:
    - ../.env.domains

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  data-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /data/logs /data/media /data/backups && chown -R 1000:1000 /data"]
    volumes:
      - appdata:/data
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run python3 scripts/setup_domains.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Missing REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    build: *backend-build
    <<: *backend-env
    restart: "no"
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  api:
    build: *backend-build
    <<: *backend-env
    restart: unless-stopped
    command: >-
      uvicorn api.main:app --host 0.0.0.0 --port 8000
      --workers 1 --no-server-header --no-access-log --no-proxy-headers
    volumes:
      - appdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  website:
    build:
      context: ../website
      args:
        WEBSITE_BASE: "/"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Public site exposes catalog + server-validated website checkout/profile, never admin API.
      - ./nginx/accord-domain-website.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/accord-domains-limits.conf:/etc/nginx/conf.d/00-accord-limits.conf:ro
      - ./nginx/proxy-params:/etc/nginx/proxy-params:ro
      - appdata:/data:ro
    ports:
      - "127.0.0.1:${ACCORD_SITE_PORT:-18081}:80"
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  dashboard:
    build: ../dashboard
    restart: unless-stopped
    volumes:
      - ./nginx/accord-domain-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/accord-domains-limits.conf:/etc/nginx/conf.d/00-accord-limits.conf:ro
      - ./nginx/proxy-params:/etc/nginx/proxy-params:ro
      - appdata:/data:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Admin service is local; TLS and MFA at the existing public edge.
      - "127.0.0.1:${ACCORD_DASHBOARD_PORT:-18082}:80"
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  miniapp:
    build:
      context: ../miniapp
      args:
        MINIAPP_BASE: "/"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/accord-domain-miniapp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/accord-domains-limits.conf:/etc/nginx/conf.d/00-accord-limits.conf:ro
      - ./nginx/proxy-params:/etc/nginx/proxy-params:ro
      - appdata:/data:ro
    ports:
      - "127.0.0.1:${ACCORD_MINIAPP_PORT:-18083}:80"
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  bot:
    profiles: ["bot"]
    build: *backend-build
    <<: *backend-env
    restart: unless-stopped
    command: python -m bot
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - appdata:/data
    logging: *logging

  scheduler:
    profiles: ["workers"]
    build: *backend-build
    <<: *backend-env
    restart: unless-stopped
    command: python -m scheduler
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - appdata:/data
    logging: *logging

volumes:
  pgdata:
  redisdata:
  appdata:
