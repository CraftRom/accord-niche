# OPTIONAL: Use only if ELFAR's Nginx itself owns host 80/443 inside Docker.
# docker network create accord-shared-edge
# Add this with -f after deploy/docker-compose.domains.yml.
services:
  website:
    networks:
      default:
      accord_edge:
        aliases: [accord-website]
  miniapp:
    networks:
      default:
      accord_edge:
        aliases: [accord-miniapp]
  dashboard:
    networks:
      default:
      accord_edge:
        aliases: [accord-dashboard]
networks:
  accord_edge:
    external: true
    name: accord-shared-edge
